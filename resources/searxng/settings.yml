use_default_settings:
  engines:
    remove:
      # These optional engines currently fail during startup in the upstream
      # container or require an external service that rejects initialization.
      - ahmia
      - torch
      - wikidata

general:
  debug: false
  instance_name: "NotNativeAgent Search"

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json

server:
  limiter: false
  public_instance: false
  image_proxy: true
